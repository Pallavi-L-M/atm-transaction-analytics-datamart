version: '3.8'

services:
  # 1. PostgreSQL Data Mart Database
  postgres-db:
    image: postgres:15-alpine
    container_name: atm_postgres
    environment:
      POSTGRES_DB: atm_datamart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Python FastAPI Analytics Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: atm_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres-db:5432/atm_datamart
    depends_on:
      - postgres-db

  # 3. React Tailwind Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
